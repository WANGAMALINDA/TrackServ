<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TrackServ</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // MIT licensed
      // ----------------------------------------------------------------------
      // GitHub Pages serves this file for ANY path it doesn't recognize as a
      // real file (e.g. a reload on /TrackServ/home). Instead of showing a
      // dead-end 404, it rewrites the path into a query string and redirects
      // to the real index.html, where a matching script in index.html
      // decodes it back into a real URL before React Router loads. This
      // keeps clean URLs working with BrowserRouter on a static host.
      //
      // pathSegmentsToKeep = 1 because this is a project site served at
      // https://<username>.github.io/TrackServ/ — the "TrackServ" segment
      // must be preserved and only the route after it gets encoded.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
